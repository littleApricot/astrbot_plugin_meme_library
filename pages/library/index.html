<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>群聊表情图库</title>
  <style>
    :root{font:15px/1.6 system-ui,sans-serif;color:#252c3b;background:#f5f6fa}*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1500px;margin:auto}h1{font-size:26px;margin:0}p{color:#687184;margin:4px 0 22px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d7dbe5;background:white;color:#303c57;padding:8px 14px;border-radius:8px}button.primary{background:#4855b8;color:white;border-color:#4855b8}button:hover{filter:brightness(.96)}button:disabled{opacity:.5;cursor:default}input,select{border:1px solid #d7dbe5;border-radius:8px;padding:9px 12px;background:white}header,.toolbar,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:24px}.toolbar{margin-bottom:20px}.toolbar input{min-width:240px;flex:1}#stats{color:#687184}#status{min-height:25px;color:#4855b8}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.card{background:white;border:1px solid #e1e4ed;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #24304a06}.card img{width:100%;height:190px;object-fit:contain;background:#edf0f5;display:block}.body{padding:15px}.meta{font-size:12px;color:#687184}.desc{white-space:pre-wrap;max-height:150px;overflow:auto;font-size:14px;min-height:45px}.badge{display:inline-block;padding:2px 8px;border-radius:20px;background:#eef0fb;color:#4855b8;margin-bottom:8px}.error{color:#b54646}#empty{padding:65px 20px;text-align:center;color:#687184;background:white;border:1px dashed #ccd1df;border-radius:12px}dialog{width:min(860px,94vw);border:1px solid #d7dbe5;border-radius:12px;padding:24px}dialog::backdrop{background:#18223970}.editor{display:grid;grid-template-columns:220px 1fr;gap:20px}.editor img{width:100%;max-height:300px;object-fit:contain;background:#f0f2f6}.editor textarea{width:100%;min-height:110px;padding:12px;border:1px solid #ccd1df;border-radius:8px;resize:vertical}.editor input{width:100%;margin-bottom:14px}.path{font:12px/1.5 ui-monospace,monospace;overflow-wrap:anywhere}.card h3{margin:5px 0;font-size:17px}.editor label{display:block;font-weight:600;margin-bottom:8px}.revisions{max-height:240px;overflow:auto;margin:18px 0}.revision{padding:12px;border-top:1px solid #e1e4ed}.revision pre{white-space:pre-wrap;font:inherit}.actions{margin-top:14px}footer{display:flex;justify-content:center;gap:15px;margin:26px 0}@media(max-width:600px){body{padding:16px}.editor{grid-template-columns:1fr}.editor img{max-height:180px}}
  </style>
</head>
<body>
  <header><div><h1>群聊表情图库</h1><p>所有群共用图库，每张图有名称和简短描述。</p></div><button id="refresh">刷新图库</button></header>
  <div class="toolbar"><input id="query" aria-label="搜索图库" placeholder="搜索名称、描述或图片 ID"><select id="filter" aria-label="处理状态"><option value="">全部状态</option><option value="ready">可用</option><option value="queued">等待识别</option><option value="processing">识别中</option><option value="rejected">未收录</option><option value="failed">失败</option><option value="disabled">已停用</option></select><span id="stats"></span></div>
  <div id="status" role="status" aria-live="polite"></div><div id="empty" hidden></div><main id="grid"></main>
  <footer><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></footer>
  <dialog id="editor"><h2>编辑图片信息</h2><div class="editor"><div><img id="preview" alt="当前表情包"><p id="record-meta" class="meta"></p></div><div>
    <label for="name">名称</label><input id="name" maxlength="24" placeholder="最多24字，例如：捂嘴偷笑">
    <label for="description">简短描述</label><textarea id="description" maxlength="120" placeholder="一两句话说明关键画面和用途，最多120字"></textarea>
    <label for="local-path">原文件路径</label><input id="local-path" class="path" readonly>
    <div class="actions"><button id="save" class="primary">保存</button><button id="history">查看修改记录</button><button id="close">关闭</button></div>
  </div></div><div id="edit-status" role="status"></div><div id="revisions" class="revisions"></div></dialog>
  <script>
    const states={ready:'可用',queued:'等待识别',processing:'识别中',rejected:'未收录',failed:'失败',disabled:'已停用',retried:'下载重试已完成'};
    const $=id=>document.getElementById(id);
    let offset=0,current=null,loading=0;
    const limit=40;
    async function api(method,path,body){
      const bridge=window.AstrBotPluginPage;
      if(!bridge)throw Error('请从 AstrBot 插件页面打开图库');
      const [endpoint,query='']=path.split('?');
      const result=method==='GET'?await bridge.apiGet(endpoint,Object.fromEntries(new URLSearchParams(query))):await bridge.apiPost(endpoint,body);
      if(result?.status==='error')throw Error(result.message||'操作失败');
      return result?.status==='ok'||result?.status==='success'?result.data:result;
    }
    function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
    async function image(id,img){try{const r=await api('GET','image?id='+encodeURIComponent(id));img.src=r.data_url;}catch{img.alt='图片预览失败';}}
    async function load(){
      const generation=++loading;$('status').textContent='正在读取图库…';
      try{
        const r=await api('GET',`library?limit=${limit}&offset=${offset}&status=${encodeURIComponent($('filter').value)}&q=${encodeURIComponent($('query').value.trim())}`);
        if(generation!==loading)return;
        $('grid').replaceChildren();
        $('stats').textContent=Object.entries(r.counts).map(([k,v])=>`${states[k]||k} ${v}`).join(' · ');
        $('empty').hidden=r.records.length>0;
        $('empty').textContent=Object.values(r.counts).some(n=>n>0)?'没有符合当前条件的图片。':'图库还是空的。群里的新图片会在这里显示。';
        $('prev').disabled=offset===0;$('next').disabled=r.records.length<limit;$('page').textContent=`第 ${Math.floor(offset/limit)+1} 页`;
        for(const record of r.records){
          const card=node('article',undefined,'card'),img=node('img');img.alt=record.name||'表情包预览';img.loading='lazy';card.append(img);
          const body=node('div',undefined,'body');
          body.append(node('span',states[record.status]||record.status,'badge'),node('h3',record.name||'等待命名'),node('div',record.id+' · 版本 '+record.revision,'meta'),node('p',record.description||'等待识别','desc'));
          if(record.error)body.append(node('p',(record.stage==='download'?'下载失败：':'识别失败：')+record.error,'error'));
          const actions=node('div',undefined,'actions'),edit=node('button','查看与编辑');edit.onclick=()=>open(record,img.src);actions.append(edit);
          if(record.status==='failed'&&record.revision===0){const retry=node('button',record.stage==='download'?'重试下载':'重试识别');retry.onclick=()=>action(record,'retry');actions.append(retry);}
          const toggle=node('button',record.status==='ready'?'停用':record.name&&record.description&&record.local_path?'启用':'');
          if(toggle.textContent){toggle.onclick=()=>action(record,record.status==='ready'?'disable':'enable');actions.append(toggle);}
          body.append(actions);card.append(body);$('grid').append(card);
          if(record.stage!=='download')image(record.id,img);else img.alt='图片尚未下载';
        }
        $('status').textContent='';
      }catch(e){$('status').textContent=e.message;}
    }
    function open(record,src){current=record;$('preview').src=src;$('name').value=record.name;$('description').value=record.description;$('local-path').value=record.local_path||'';$('record-meta').textContent=record.id+' · 版本 '+record.revision;$('edit-status').textContent='';$('revisions').replaceChildren();$('editor').showModal();}
    async function action(record,action,extra={}){try{await api('POST','action',{id:record.id,action,...extra});await load();}catch(e){$('status').textContent=e.message;}}
    $('save').onclick=async()=>{
      try{
        const r=await api('POST','document',{id:current.id,revision:current.revision,name:$('name').value,description:$('description').value});
        current={...current,...r};$('record-meta').textContent=current.id+' · 版本 '+current.revision;$('edit-status').textContent='已保存';await load();
      }catch(e){$('edit-status').textContent=e.message;}
    };
    $('history').onclick=async()=>{
      try{
        const r=await api('GET','revisions?id='+encodeURIComponent(current.id));$('revisions').replaceChildren();
        for(const revision of r.revisions){
          const item=node('section',undefined,'revision');item.append(node('strong','版本 '+revision.revision+' · '+revision.name),node('p',revision.description),node('small',revision.reason));
          const restore=node('button','恢复此版本');restore.onclick=async()=>{
            try{await api('POST','action',{id:current.id,action:'restore',revision:current.revision,restore_revision:revision.revision});$('editor').close();await load();}catch(e){$('edit-status').textContent=e.message;}
          };item.append(restore);$('revisions').append(item);
        }
      }catch(e){$('edit-status').textContent=e.message;}
    };
    $('close').onclick=()=>$('editor').close();$('refresh').onclick=load;
    $('filter').onchange=()=>{offset=0;load();};$('query').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){offset=0;load();}};
    $('prev').onclick=()=>{offset=Math.max(0,offset-limit);load();};$('next').onclick=()=>{offset+=limit;load();};
    if(window.AstrBotPluginPage)load();else window.addEventListener('load',load,{once:true});
  </script>
</body>
</html>
